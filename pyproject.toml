[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "respire"
version = "1.0.0"
description = "Recursive self-improving closed-loop anaesthesia controller with latent physiological pattern recognition"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ReSPIRe authors" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "torch>=2.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "black>=24.4",
  "isort>=5.13",
]

[project.scripts]
respire = "respire.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RET", "ARG", "PTH", "NPY"]
ignore = ["B008", "RET504"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005"]
# the verification driver carries prose check descriptions that do not wrap
"scripts/*" = ["E501"]
# The comparison arms and the controller implement one duck-typed interface, so `explore` and
# `batch` are part of the contract even where an arm has no use for them.
"src/respire/comparators/*" = ["ARG002"]
"src/respire/control/policy.py" = ["ARG002"]
"src/respire/models/deterministic_head.py" = ["ARG002"]
# Global seeding of the legacy numpy stream is the point of the helper.
"src/respire/utils/seeding.py" = ["NPY002"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
warn_unreachable = true
disallow_untyped_decorators = false
plugins = []
exclude = ["build", "dist"]

[[tool.mypy.overrides]]
module = ["scipy.*", "yaml.*"]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["respire"]
