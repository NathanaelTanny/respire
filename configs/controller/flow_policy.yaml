# Section document: the flow-matching policy head.

policy:
  action_dim: 2
  hidden: 128
  depth: 3
  time_features: 16
  euler_steps: 4
  latent_dim: 16
  hidden_state_dim: 32
  axis_dim: 3
  lr: 0.0003
  weight_decay: 0.0001
  batch_size: 512
  epochs: 6
  bc_epochs: 12
  grad_clip: 1.0
  sigma_min: 0.0001
